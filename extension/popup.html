<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Spoiler Shield</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 320px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: #111116; color: #e8e8ee; }
    body.tab { width: auto; max-width: 520px; margin: 40px auto; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid #22222a; }
    header img { width: 24px; height: 24px; }
    header h1 { flex: 1; font-size: 15px; margin: 0; font-weight: 650; }
    .status { padding: 10px 16px; color: #a0a0ad; border-bottom: 1px solid #22222a; }
    .status b { color: #fb7185; font-weight: 650; }
    section { padding: 12px 16px; border-bottom: 1px solid #22222a; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
    .row[hidden] { display: none; }
    .row span small { display: block; color: #7d7d8a; font-size: 11.5px; }
    .switch { position: relative; width: 36px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .switch i { position: absolute; inset: 0; background: #2c2c35; border-radius: 20px; transition: .15s; cursor: pointer; }
    .switch i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: .15s; }
    .switch input:checked + i { background: #e11d48; }
    .switch input:checked + i::after { transform: translateX(16px); }
    .seg { display: flex; background: #1c1c23; border-radius: 8px; padding: 2px; }
    .seg button { border: 0; background: none; color: #a0a0ad; font: inherit; padding: 4px 12px; border-radius: 6px; cursor: pointer; }
    .seg button.on { background: #33333d; color: #fff; }
    label.kwl { display: block; margin-bottom: 6px; font-weight: 600; }
    label.kwl small { font-weight: 400; color: #7d7d8a; }
    textarea { width: 100%; height: 170px; resize: vertical; background: #0b0b0f; color: #e8e8ee; border: 1px solid #2c2c35; border-radius: 8px; padding: 8px 10px; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    textarea:focus { outline: none; border-color: #e11d48; }
    .actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .actions button { border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; background: #e11d48; color: #fff; }
    .actions button.ghost { background: #23232b; color: #c8c8d2; font-weight: 500; }
    .saved { color: #4ade80; font-size: 12px; opacity: 0; transition: opacity .2s; }
    .saved.show { opacity: 1; }
    footer { padding: 10px 16px 14px; color: #6b6b78; font-size: 11.5px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>Spoiler Shield</h1>
    <label class="switch" title="On/off everywhere"><input type="checkbox" id="enabled"><i></i></label>
  </header>

  <div class="status" id="status">Checking this tab…</div>

  <section>
    <div class="row" id="siteRow" hidden>
      <span>Active on <b id="host"></b></span>
      <label class="switch"><input type="checkbox" id="siteOn"><i></i></label>
    </div>
    <div class="row">
      <span>Mode</span>
      <div class="seg" id="mode"><button data-v="blur">Blur</button><button data-v="hide">Hide</button></div>
    </div>
    <div class="row">
      <span>Page warning<small>Full-screen stop when the page itself is about a keyword</small></span>
      <label class="switch"><input type="checkbox" id="pageGuard"><i></i></label>
    </div>
  </section>

  <section>
    <label class="kwl" for="keywords">Keywords <small>one per line, /regex/ works</small></label>
    <textarea id="keywords" spellcheck="false"></textarea>
    <div class="actions">
      <button id="save">Save</button>
      <button id="reset" class="ghost">Reset to GTA list</button>
      <span class="saved" id="saved">Saved</span>
    </div>
  </section>

  <footer>Click a blurred item to reveal it. Everything runs locally, nothing leaves your browser.</footer>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>

name: Release

# Two ways to cut a release for the version in extension/manifest.json:
#  - push a matching tag, e.g. `git tag v1.0.1 && git push origin v1.0.1`
#  - or click "Run workflow" on this workflow in the Actions tab
# Either way it builds the zip and attaches it to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Work out the version
        id: v
        run: |
          V=$(node -p "require('./extension/manifest.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $V"; exit 1
          fi
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - run: bash scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/*.zip \
            --target "$GITHUB_SHA" --title "${{ steps.v.outputs.tag }}" --generate-notes
